services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: zt-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Karachi
      # Lets the Code node use libraries if ever needed
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto
    volumes:
      - n8n_data:/home/node/.n8n
      # Your project files are visible inside n8n at /data (KB, samples)
      - ./:/data

volumes:
  n8n_data:
